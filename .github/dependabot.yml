# Dependabot: keep dependencies and Actions current so the SCA stage
# is fighting new CVEs, not archaeology. The intentionally vulnerable
# pins in app/requirements.txt are the lab's teaching target -- in a
# real deployment these update PRs are the remediation pipeline.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
